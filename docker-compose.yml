version: '3.9'

services:
  api:
    build: .
    container_name: anexar-api-dev
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      - ENVIRONMENT=development
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - anexar-network

networks:
  anexar-network:
    driver: bridge
